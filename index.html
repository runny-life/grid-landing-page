<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.png"
    sizes="32x32"
  />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Grid Landing Page</title>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a
        class="logo"
        href="#"
        aria-current="page"
        aria-label="Home"
      >
        <span class="logo__icon"></span>
        Bridge Collective
      </a>
      <button
        class="toggle-menu"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >
        <span class="toggle-menu__icon-menu">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 8h16M4 16h16" />
          </svg>
        </span>
        <span class="toggle-menu__close">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </span>
      </button>
    </div>
  </header>
  <script
    type="module"
    src="/src/scripts/app.js"
  ></script>
</body>
</html>
